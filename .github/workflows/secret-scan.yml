name: secret-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # scripts/scan.sh is the single source of truth for what's checked
      # (gitleaks + the internal-name/internal-IP denylist) -- CI calls the
      # same script a contributor runs locally before committing, so the two
      # can never drift out of agreement about what "clean" means.
      - name: secret + internal-name scan
        run: |
          chmod +x scripts/scan.sh
          ./scripts/scan.sh

  rule-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install jinja2 pyyaml
      - name: boiler_monitoring.jinja rule-chain selftest
        run: python3 scripts/_jinja_selftest.py
